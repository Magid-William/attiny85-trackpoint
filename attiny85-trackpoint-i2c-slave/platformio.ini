[platformio]
src_dir = ../trackpoint-i2c-slave-attiny85

[env:program_via_ArduinoISP]
platform = atmelavr
framework = arduino
board = attiny85
board_build.f_cpu = 8000000UL
lib_extra_dirs = ../libraries
upload_protocol = stk500v1
; each flag in a new line
upload_flags =
    -P$UPLOAD_PORT
    -b$UPLOAD_SPEED

upload_speed = 19200
